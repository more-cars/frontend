apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-public-http
spec:
  hostnames:
    - more-cars.net
    - www.more-cars.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: more-cars-gateway
      sectionName: more-cars-public-http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: more-cars-gateway
      sectionName: more-cars-public-www-http
  rules:
    - filters:
        - requestRedirect:
            hostname: more-cars.net
            scheme: https
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /
