apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-public-https
spec:
  hostnames:
    - more-cars.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: more-cars-gateway
      sectionName: more-cars-public-https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: frontend
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
